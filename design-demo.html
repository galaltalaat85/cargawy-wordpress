<title>CarGawy Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap">
<style>
/* Layout: brand-committed light UI. Navy bands (hero, footer, dashboard rail) frame white information cards; green marks only verified or actionable things ("على نور" = information made visible). Single deliberate theme. */
:root{
  --navy:#061629; --navy-2:#142B35; --green:#22A66F; --green-ink:#17794F; --lime:#00E65A;
  --paper:#F2F4F2; --white:#FFFFFF; --gold:#D6A85F;
  --ink:#061629; --muted:#4A5A63; --line:#DCE2DF; --soft:#E8EDEA;
  --warn:#8A5200; --warn-bg:#FFF4E0; --danger:#B42318; --danger-bg:#FDECEA; --info:#1F5E8C; --info-bg:#E8F1F8; --ok-bg:#E3F4EC; --gold-bg:#F7EEDD;
  --on-navy:#FFFFFF; --on-navy-muted:#A9B8C0;
  --f-ar:"Cairo","Segoe UI",Tahoma,sans-serif; --f-en:"Inter","Segoe UI",Roboto,Arial,sans-serif;
  --r-s:6px; --r-m:12px; --sh1:0 1px 2px rgba(6,22,41,.06),0 1px 1px rgba(6,22,41,.04); --sh2:0 10px 28px rgba(6,22,41,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
html[lang="en"] body{font-family:var(--f-en);line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--white)}
h1,h2,h3,h4{line-height:1.35;text-wrap:balance;margin:0}
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3{line-height:1.2}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green-ink);outline-offset:2px;border-radius:4px}
.dark :focus-visible{outline-color:var(--lime)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:768px){.wrap{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{flex:none}

/* demo bar */
.demobar{background:var(--navy-2);color:var(--on-navy);font-size:13px}
.demobar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-block:8px}
.demobar strong{color:var(--gold)}
.demobar nav{display:flex;flex-wrap:wrap;gap:4px}
.demobar a{text-decoration:none;padding:2px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:var(--on-navy-muted)}
.demobar a[aria-current="page"]{background:var(--green);color:var(--navy);border-color:var(--green);font-weight:700}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--white);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:16px;min-height:64px}
.logo{display:flex;align-items:baseline;gap:8px;text-decoration:none;font-family:var(--f-en);font-weight:800;font-size:24px;letter-spacing:-.5px;color:var(--navy)}
.logo span{color:var(--green-ink)}
.logo-img{width:56px;height:56px;border-radius:50%;display:block}
@media(max-width:600px){.logo-img{width:48px;height:48px}}
.ftr .logo-img{width:120px;height:120px}
.logo small{font-family:var(--f-ar);font-size:10px;font-weight:600;letter-spacing:0;color:var(--muted);border:1px dashed var(--line);padding:0 6px;border-radius:4px}
.mainnav{display:flex;gap:4px;margin-inline-start:12px}
.mainnav a{text-decoration:none;padding:8px 12px;border-radius:var(--r-s);font-weight:600;color:var(--muted)}
.mainnav a:hover,.mainnav a[aria-current="page"]{color:var(--navy);background:var(--soft)}
.hdr-end{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--white);cursor:pointer}
.langbtn{height:44px;padding:0 12px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--white);cursor:pointer;font-weight:700;font-size:14px}
.menubtn{display:none}
@media(max-width:900px){
  .mainnav{display:none;position:absolute;inset-inline:0;top:100%;background:var(--white);flex-direction:column;padding:8px 16px 16px;border-bottom:1px solid var(--line);box-shadow:var(--sh2);margin:0}
  .mainnav.open{display:flex}
  .mainnav a{padding:12px}
  .menubtn{display:inline-grid}
  .hdr .btn-sell{display:none}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--r-s);border:1px solid transparent;font-weight:700;text-decoration:none;cursor:pointer;transition:background .15s,box-shadow .15s,transform .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--green);color:var(--navy)}
.btn-primary:hover{background:#28b97c}
.btn-navy{background:var(--navy);color:var(--white)}
.btn-navy:hover{background:var(--navy-2)}
.btn-outline{background:var(--white);border-color:var(--line);color:var(--navy)}
.btn-outline:hover{border-color:var(--navy)}
.btn-ghost-dark{background:transparent;color:var(--white);border-color:rgba(255,255,255,.35)}
.btn-ghost-dark:hover{border-color:var(--white)}
.btn-wa{background:var(--green-ink);color:var(--white)}
.btn-wa:hover{background:#12663F}
.btn-danger{background:var(--white);color:var(--danger);border-color:#F0C4BF}
.btn-l{min-height:52px;font-size:17px}
.btn-s{min-height:36px;padding:0 12px;font-size:14px}
.btn-block{width:100%}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;line-height:1;padding:6px 9px;border-radius:999px;white-space:nowrap}
.chip svg{width:14px;height:14px}
.c-ok{background:var(--ok-bg);color:var(--green-ink)}
.c-badge{background:var(--green);color:var(--navy)}
.c-info{background:var(--info-bg);color:var(--info)}
.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-danger{background:var(--danger-bg);color:var(--danger)}
.c-neutral{background:var(--white);color:var(--muted);border:1px solid var(--line)}
.c-gold{background:var(--gold-bg);color:#6B4E1E;border:1px solid #E8D3AE}
.c-navy{background:var(--navy);color:var(--white)}

/* hero */
.hero{background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -10% -60% 30%;height:120%;background:radial-gradient(closest-side,rgba(34,166,111,.22),transparent 70%);pointer-events:none}
html[dir="rtl"] .hero::after{inset:auto 30% -60% -10%}
.hero .wrap{position:relative;z-index:1;display:grid;gap:28px;padding-block:40px 32px}
@media(min-width:1024px){.hero .wrap{grid-template-columns:1.05fr .95fr;align-items:center;padding-block:64px 56px}}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--green)}
html[lang="en"] .eyebrow{text-transform:uppercase;letter-spacing:.08em}
.hero h1{font-size:clamp(30px,6vw,52px);font-weight:800;margin-block:8px 12px}
.hero h1 em{font-style:normal;color:var(--lime)}
.hero .lede{color:var(--on-navy-muted);font-size:17px;max-width:46ch}
.hero-ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.hero-art{max-width:560px;width:100%;justify-self:center}
.hero-art svg{border-radius:var(--r-m);display:block;width:100%;height:auto}
@media(min-width:901px){.mainnav .mob-only{display:none}}
.hero-art .note{font-size:12px;color:var(--on-navy-muted);text-align:center;margin-top:4px}

/* search panel */
.searchpanel{background:var(--white);color:var(--ink);border-radius:var(--r-m);box-shadow:var(--sh2);padding:16px;display:grid;gap:12px;grid-template-columns:1fr 1fr}
.searchpanel .f-wide{grid-column:1/-1}
@media(min-width:1024px){.searchpanel{grid-template-columns:repeat(5,1fr) auto;align-items:end;padding:20px}.searchpanel .f-wide{grid-column:auto}}
.searchwrap{position:relative;z-index:2;margin-top:-4px;padding-bottom:8px}
.field{display:grid;gap:4px;min-width:0}
.field label,.flabel{font-size:13px;font-weight:700;color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--white);padding:8px 12px}
textarea.input{min-height:96px;resize:vertical}
.input:focus{border-color:var(--green-ink);outline:none;box-shadow:0 0 0 3px rgba(34,166,111,.18)}
.help{font-size:12.5px;color:var(--muted)}

/* sections */
.sec{padding-block:48px}
.sec-h{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 16px;margin-bottom:20px}
.sec-h h2{font-size:clamp(22px,3.4vw,30px);font-weight:800}
.sec-h p{color:var(--muted);max-width:60ch}
.link{color:var(--green-ink);font-weight:700;text-decoration:none}
.link:hover{text-decoration:underline}

/* make chips */
.makes{display:flex;flex-wrap:wrap;gap:8px}
.make{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;background:var(--white);border:1px solid var(--line);border-radius:999px;text-decoration:none;font-weight:700;cursor:pointer}
html[dir="rtl"] .make{padding:8px 8px 8px 14px}
.make:hover{border-color:var(--navy)}
.make i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--white);font-style:normal;font-family:var(--f-en);font-size:12px}
.make b{font-weight:600;color:var(--muted);font-size:13px}

/* car grid & card */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{position:relative;background:var(--white);border-radius:var(--r-m);box-shadow:var(--sh1);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.card a.cover{position:absolute;inset:0;z-index:1}
.card .ph{aspect-ratio:4/3;max-width:100%;position:relative;background:var(--soft)}
.card .ph svg{width:100%;height:100%;display:block}
.card .tl{position:absolute;inset-block-start:10px;inset-inline-start:10px;display:flex;gap:6px;flex-wrap:wrap}
.fav{position:absolute;inset-block-start:8px;inset-inline-end:8px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh1)}
.fav[aria-pressed="true"] svg{fill:var(--danger);stroke:var(--danger)}
.card .bd{padding:14px 16px 16px;display:grid;gap:8px;flex:1}
.card h3{font-size:17px;font-weight:700}
.card h3 bdi{font-family:inherit}
.specs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--muted)}
.specs span{display:inline-flex;align-items:center;gap:5px}
.specs svg{width:15px;height:15px}
.price{font-size:21px;font-weight:800;color:var(--navy)}
.price small{font-size:13px;font-weight:600;color:var(--muted)}
.card .ver{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;border-top:1px solid var(--soft);margin-top:auto}
.ribbon{position:absolute;inset-block-end:10px;inset-inline-start:10px}

/* trust */
.trust{background:var(--white);border-block:1px solid var(--line)}
.trust-grid{display:grid;gap:16px}
@media(min-width:900px){.trust-grid{grid-template-columns:1fr 1fr}}
.tcard{border:1px solid var(--line);border-radius:var(--r-m);padding:20px;display:grid;gap:12px;align-content:start}
.tcard h3{font-size:20px;display:flex;align-items:center;gap:10px}
.tcard h3 .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--navy);color:var(--lime)}
.lists{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:520px){.lists{grid-template-columns:1fr}}
.lists h4{font-size:14px;margin-bottom:4px}
.lists ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14.5px}
.lists li{display:flex;gap:6px;align-items:flex-start}
.lists li svg{width:16px;height:16px;margin-top:5px}
.yes svg{color:var(--green-ink)} .no svg{color:var(--muted)}
.rule{font-size:14px;background:var(--paper);border-radius:var(--r-s);padding:10px 12px;color:var(--muted)}

/* why */
.why{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.why div{display:grid;gap:6px}
.why h3{font-size:17px}
.why p{color:var(--muted);font-size:15px}
.why .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--ok-bg);color:var(--green-ink)}

/* steps */
.steps{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);padding:18px;display:grid;gap:6px}
.steps li::before{content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--navy);color:var(--white);font-weight:800;font-family:var(--f-en)}
.steps p{color:var(--muted);font-size:15px}

/* cta band */
.band{background:var(--navy-2);color:var(--on-navy)}
.band .wrap{display:grid;gap:16px;padding-block:36px;align-items:center}
@media(min-width:800px){.band .wrap{grid-template-columns:1fr auto}}
.band h2{font-size:clamp(22px,3.4vw,30px)}
.band p{color:var(--on-navy-muted)}

/* blog */
.post{background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;display:grid}
.post .pt{aspect-ratio:16/8;background:linear-gradient(135deg,var(--navy),var(--navy-2));display:grid;place-items:center;color:var(--green);max-width:100%}
.post .pb{padding:16px;display:grid;gap:6px}
.post h3{font-size:17px}
.post .meta{font-size:13px;color:var(--muted)}

/* faq */
.faq{display:grid;gap:8px;max-width:820px}
.faq details{background:var(--white);border:1px solid var(--line);border-radius:var(--r-s);padding:4px 16px}
.faq summary{cursor:pointer;font-weight:700;padding-block:10px;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";font-weight:800;color:var(--green-ink)}
.faq details[open] summary::after{content:"–"}
.faq p{padding-bottom:12px;color:var(--muted)}

/* footer */
.ftr{background:var(--navy);color:var(--on-navy-muted);font-size:14.5px}
.ftr .wrap{padding-block:40px 24px;display:grid;gap:28px}
.fcols{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.ftr h4{color:var(--white);font-size:15px;margin-bottom:8px}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ftr a{text-decoration:none}
.ftr a:hover{color:var(--white)}
.ftr .logo{color:var(--white)}
.ftr .logo span{color:var(--green)}
.ftr .tag{color:var(--white);font-weight:700;margin-top:6px}
.ph-note{border:1px dashed rgba(255,255,255,.25);border-radius:var(--r-s);padding:8px 10px;font-size:13px}
.ftr .bottom{border-top:1px solid rgba(255,255,255,.1);padding-top:16px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:13px}

/* browse */
.pagehead{background:var(--white);border-bottom:1px solid var(--line)}
.pagehead .wrap{padding-block:20px;display:grid;gap:6px}
.crumbs{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--navy)}
.pagehead h1{font-size:clamp(24px,4vw,34px);font-weight:800}
.browse{display:grid;gap:24px;padding-block:24px 56px}
@media(min-width:1024px){.browse{grid-template-columns:280px 1fr;align-items:start}}
.filters{background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;display:grid;gap:16px}
@media(min-width:1024px){.filters{position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}}
.filters fieldset{border:0;padding:0;margin:0;display:grid;gap:8px;min-width:0}
.filters legend{font-weight:800;font-size:14px;margin-bottom:4px;padding:0}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;background:var(--white)}
.checks input{accent-color:var(--green-ink)}
.checks label:has(input:checked){border-color:var(--green-ink);background:var(--ok-bg);color:var(--green-ink);font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fhead{display:flex;justify-content:space-between;align-items:center}
.fhead h2{font-size:18px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}
.toolbar .count{font-weight:700}
.toolbar .count b{color:var(--green-ink)}
.toolbar select{width:auto}
.active-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.active-chips button{border:1px solid var(--navy);background:var(--white);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.ftoggle{display:none}
@media(max-width:1023px){
  .ftoggle{display:inline-flex}
  .filters{display:none;position:fixed;inset:0;z-index:70;border-radius:0;overflow:auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .filters.open{display:grid;align-content:start}
  .fapply{position:fixed;inset-inline:0;bottom:0;background:var(--white);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
}
@media(min-width:1024px){.fapply,.fclose{display:none}}
.empty{background:var(--white);border:1px dashed var(--line);border-radius:var(--r-m);padding:40px 16px;text-align:center;display:grid;gap:10px;justify-items:center}

/* details */
.det{display:grid;gap:24px;padding-block:20px 120px}
@media(min-width:1024px){.det{grid-template-columns:minmax(0,1fr) 380px;align-items:start;padding-bottom:56px}}
.gal{background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.gal .main{aspect-ratio:4/3;max-width:100%;position:relative}
.gal .main svg{width:100%;height:100%;display:block}
.gal .counter{position:absolute;inset-block-end:10px;inset-inline-end:10px;background:rgba(6,22,41,.75);color:var(--white);font-size:13px;padding:2px 10px;border-radius:999px}
.thumbs{display:flex;gap:8px;padding:10px;overflow-x:auto}
.thumbs button{flex:none;width:84px;aspect-ratio:4/3;border:2px solid transparent;border-radius:8px;overflow:hidden;padding:0;cursor:pointer;background:var(--soft)}
.thumbs button[aria-current="true"]{border-color:var(--green-ink)}
.thumbs svg{width:100%;height:100%;display:block}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);padding:20px;display:grid;gap:14px}
.panel h2{font-size:19px}
.side{display:grid;gap:16px}
@media(min-width:1024px){.side{position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}}
.dtitle h1{font-size:clamp(22px,3.6vw,30px);font-weight:800}
.bigprice{font-size:30px;font-weight:800}
.keyspecs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.keyspecs div{background:var(--paper);border-radius:var(--r-s);padding:10px;display:grid;gap:2px}
.keyspecs span{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.keyspecs span svg{width:14px;height:14px}
.keyspecs b{font-size:15.5px}
.vgrid{display:grid;gap:12px}
@media(min-width:700px){.vgrid{grid-template-columns:1fr 1fr}}
.vbox{border:1px solid var(--line);border-radius:var(--r-m);padding:16px;display:grid;gap:10px;align-content:start}
.vbox.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.vbox h3{font-size:16px;display:flex;gap:8px;align-items:center}
.vbox h3 svg{width:20px;height:20px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cats div{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13.5px;background:var(--paper);border-radius:6px;padding:6px 8px}
.cats i{font-style:normal;font-weight:700;font-size:12px}
.cats .k-ok{color:var(--green-ink)} .cats .k-obs{color:var(--warn)}
.small{font-size:13.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:start;padding:10px 8px;border-bottom:1px solid var(--soft);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:700}
.kv th{width:42%;color:var(--muted);font-weight:600;font-size:14.5px}
.seller{display:flex;gap:12px;align-items:center}
.avatar{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--navy);color:var(--white);font-weight:800;font-family:var(--f-en)}
.contact{display:grid;gap:8px}
.stickybar{display:none}
@media(max-width:1023px){
  .stickybar{display:flex;gap:8px;position:fixed;inset-inline:0;bottom:0;z-index:40;background:var(--white);border-top:1px solid var(--line);box-shadow:var(--sh2);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .stickybar .btn{flex:1;padding:0 10px}
  .side .contact{display:none}
}
.tips{font-size:14px;color:var(--muted);display:grid;gap:4px;padding-inline-start:18px;margin:0}

/* wizard */
.wiz{max-width:760px;margin-inline:auto;padding-block:24px 56px;display:grid;gap:16px}
.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;list-style:none;padding:0;margin:0}
.progress li{display:grid;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.progress li::before{content:"";height:6px;border-radius:3px;background:var(--line)}
.progress li.done::before,.progress li.cur::before{background:var(--green)}
.progress li.cur{color:var(--navy)}
@media(max-width:560px){.progress li span{display:none}.progress li.cur span{display:inline}}
.fgrid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.fgrid .full{grid-column:1/-1}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.wnav{display:flex;justify-content:space-between;gap:8px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.photos div{aspect-ratio:4/3;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center;padding:4px;background:var(--paper)}
.photos div.has{border-style:solid;padding:0;overflow:hidden}
.photos svg{width:100%;height:100%}
.notice{border-radius:var(--r-s);padding:12px 14px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.notice svg{width:18px;height:18px;margin-top:4px}
.n-info{background:var(--info-bg);color:var(--info)}
.n-warn{background:var(--warn-bg);color:var(--warn)}

/* dashboard */
.dash{display:grid;min-height:70vh;grid-template-columns:minmax(0,1fr)}
.rail{min-width:0}
@media(min-width:1024px){.dash{grid-template-columns:240px minmax(0,1fr)}}
.rail{background:var(--navy);color:var(--on-navy-muted);padding:16px}
.rail .who{display:flex;gap:10px;align-items:center;color:var(--white);padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:8px}
.rail .who .avatar{background:var(--green);color:var(--navy)}
.rail .who small{display:block;color:var(--on-navy-muted);font-size:12px}
.rail nav{display:grid;gap:2px}
.rail button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:var(--r-s);font-weight:600}
.rail button:hover{color:var(--white);background:rgba(255,255,255,.06)}
.rail button[aria-current="true"]{background:var(--navy-2);color:var(--white);box-shadow:inset 3px 0 0 var(--lime)}
html[dir="rtl"] .rail button[aria-current="true"]{box-shadow:inset -3px 0 0 var(--lime)}
.rail button:focus-visible{outline:2px solid var(--lime)}
.rail .cnt{background:var(--gold);color:var(--navy);border-radius:999px;font-size:12px;padding:0 8px;font-weight:800}
@media(max-width:1023px){.rail nav{display:flex;overflow-x:auto}.rail button{white-space:nowrap}.rail .who{border:0;margin:0}}
.dmain{padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:grid;gap:20px;align-content:start;min-width:0}
@media(min-width:768px){.dmain{padding:28px 32px 56px}}
.dmain h1{font-size:24px;font-weight:800}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;display:grid;gap:2px}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
.kpi b{font-size:26px;font-weight:800}
.kpi small{font-size:12px;color:var(--muted)}
.kpi.attn{border-color:var(--gold);background:linear-gradient(var(--gold-bg),var(--white))}
.box{background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;display:grid;gap:12px;min-width:0}
.box h2{font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--navy);color:var(--white);border-color:var(--navy)}
.qrow{display:grid;gap:10px;grid-template-columns:88px minmax(0,1fr);align-items:center;padding-block:12px;border-bottom:1px solid var(--soft)}
.qrow:last-child{border:0}
.qrow .thumb{aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--soft)}
.qrow .thumb svg{width:100%;height:100%;display:block}
.qrow .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media(min-width:900px){.qrow{grid-template-columns:88px minmax(0,1fr) auto}.qrow .acts{grid-column:auto}}
.qrow h3{font-size:15.5px}
.qrow .m{font-size:13px;color:var(--muted)}
.rejectbox{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.rejectbox select{flex:1;min-width:180px}
.audit{font-size:13.5px;display:grid;gap:6px;margin:0;padding:0;list-style:none}
.audit li{display:flex;gap:8px;color:var(--muted)}
.audit time{color:var(--ink);font-weight:700;white-space:nowrap}

/* toast */
.toast{position:fixed;z-index:90;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;padding-inline:16px}
.toast div{background:var(--navy);color:var(--white);padding:12px 16px;border-radius:var(--r-s);box-shadow:var(--sh2);max-width:560px;font-size:14.5px;display:flex;gap:8px;align-items:flex-start;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
.toast div.show{opacity:1;transform:none}
.toast svg{color:var(--lime);width:18px;height:18px;margin-top:3px}
@media(min-width:1024px){.toast{bottom:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}
let gid=0;
function carSVG(c,view){
  const col=COLORS[c.col][0],dk=shade(col,-45),lt=shade(col,40);const id='g'+(gid++);
  const bg=view===2?['#142B35','#061629']:['#F7F9F8','#E2E8E5'];
  let body,win;
  if(c.bd==='suv'){body='M38 196 Q38 166 62 160 L112 152 L146 104 Q152 96 166 96 L296 96 Q312 96 320 108 L346 152 Q374 158 374 184 L374 208 Q374 218 362 218 L48 218 Q38 218 38 208 Z';win='<path d="M154 150 L176 108 L238 108 L238 150 Z"/><path d="M248 108 L298 108 Q308 108 313 116 L332 150 L248 150 Z"/>'}
  else if(c.bd==='hatchback'){body='M48 200 Q48 172 74 166 L120 158 Q156 116 196 112 L276 112 Q302 112 318 132 L348 168 Q368 172 368 194 L368 210 Q368 218 358 218 L56 218 Q48 218 48 210 Z';win='<path d="M134 158 Q162 124 196 122 L222 122 L222 158 Z"/><path d="M232 122 L274 122 Q294 122 306 136 L326 158 L232 158 Z"/>'}
  else{body='M34 200 Q36 176 64 170 L128 162 Q164 124 206 121 L268 123 Q298 127 328 160 L360 168 Q376 172 376 196 L376 210 Q376 218 366 218 L44 218 Q34 218 34 210 Z';win='<path d="M142 162 Q172 132 206 130 L216 130 L216 162 Z"/><path d="M226 130 L266 131 Q290 135 312 162 L226 162 Z"/>'}
  const mir=view===1?' transform="translate(410 0) scale(-1 1)"':'';
  return `<svg viewBox="0 0 410 300" role="img" aria-label="${esc(nm(MAKES,c.mk)+' '+c.md)}" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${bg[0]}"/><stop offset="1" stop-color="${bg[1]}"/></linearGradient><linearGradient id="${id}c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${lt}"/><stop offset=".55" stop-color="${col}"/><stop offset="1" stop-color="${dk}"/></linearGradient></defs><rect width="410" height="300" fill="url(#${id}b)"/><rect y="232" width="410" height="68" fill="${view===2?'#0B1F2E':'#D7DFDB'}"/><ellipse cx="205" cy="236" rx="180" ry="10" fill="#061629" opacity=".18"/><g${mir}><path d="${body}" fill="url(#${id}c)" stroke="${dk}" stroke-width="1.5"/><g fill="#1B2A36" opacity=".88">${win}</g><path d="M60 192 L360 190" stroke="${lt}" stroke-width="2" opacity=".6"/><rect x="352" y="176" width="16" height="7" rx="3" fill="#F2D27A"/><rect x="40" y="180" width="12" height="7" rx="3" fill="#C2423A"/>${[110,302].map(x=>`<circle cx="${x}" cy="218" r="29" fill="#141B21"/><circle cx="${x}" cy="218" r="16" fill="#9AA5AD"/><circle cx="${x}" cy="218" r="5" fill="#141B21"/>`).join('')}</g></svg>`;
}

/* ---------- shared bits ---------- */
function inspChip(c){
  if(hasBadge(c))return c.insp.o==='obs'?`<span class="chip c-ok">${I.shield}${L().badgeObs}</span>`:`<span class="chip c-badge">${I.shield}${L().badge}</span>`;
  if(c.insp.s==='completed')return `<span class="chip c-warn">${I.clock}${L().awaiting}</span>`;
  if(c.insp.s==='scheduled')return `<span class="chip c-info">${I.clock}${L().sched}</span>`;
  if(c.insp.s==='requested')return `<span class="chip c-info">${I.clock}${L().req}</span>`;
  return `<span class="chip c-neutral">${L().notI}</span>`;
}
function legalChip(c){
  if(c.legal==='approved')return `<span class="chip c-info">${I.doc}${L().legalOk}</span>`;
  if(c.legal==='review')return `<span class="chip c-neutral">${I.doc}${L().legalRev}</span>`;
  return '';
}
function srcChip(c){
  if(c.src==='cargawy_inventory')return `<span class="chip c-navy">${L().sources[c.src]}</span>`;
  return `<span class="chip c-neutral">${L().sources[c.src]}</span>`;
}
function card(c){
  return `<article class="card"><div class="ph">${carSVG(c,0)}<div class="tl">${srcChip(c)}${c.feat?`<span class="chip c-gold">${I.star}${L().featuredC}</span>`:''}</div></div>
  <button class="fav" type="button" data-fav="${c.id}" aria-pressed="${FAVS.has(c.id)}" aria-label="${L().fav}">${I.heart}</button>
  <div class="bd"><h3>${title(c)}</h3>
  <div class="specs num"><span>${I.cal}${c.y}</span><span>${I.gauge}${fmt(c.km)} ${L().km}</span><span>${I.gear}${L().transM[c.tr]}</span></div>
  <div class="specs"><span>${I.pin}${nm(CITIES,c.ct)}، ${nm(GOVS,c.gv)}</span></div>
  <div class="price num">${priceH(c)}</div>
  <div class="ver">${inspChip(c)}${legalChip(c)}</div></div>
  <a class="cover" href="#car-${c.id}" aria-label="${esc(nm(MAKES,c.mk)+' '+c.md+' '+c.y)}"></a></article>`;
}
function opts(map,sel,anyLabel){return (anyLabel!==undefined?`<option value="">${anyLabel}</option>`:'')+Object.keys(map).map(k=>`<option value="${k}"${k===sel?' selected':''}>${nm(map,k)}</option>`).join('')}
function toast(msg){const t=document.getElementById('toast');t.innerHTML=I.info+'<span>'+msg+'</span>';t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),4200)}
const t=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);

let F={mk:'',pmin:'',pmax:'',ymin:'',kmmax:'',tr:[],fu:[],bd:[],gv:'',src:[],insp:false,legal:false,sort:'new'};
function filtered(){
  let r=pub().filter(c=>(!F.mk||c.mk===F.mk)&&(!F.pmin||c.p>=+F.pmin)&&(!F.pmax||c.p<=+F.pmax)&&(!F.ymin||c.y>=+F.ymin)&&(!F.kmmax||c.km<=+F.kmmax)&&(!F.tr.length||F.tr.includes(c.tr))&&(!F.fu.length||F.fu.includes(c.fu))&&(!F.bd.length||F.bd.includes(c.bd))&&(!F.gv||c.gv===F.gv)&&(!F.src.length||F.src.includes(c.src))&&(!F.insp||hasBadge(c))&&(!F.legal||c.legal==='approved')&&(!F.model||c.md===F.model));
  const s={new:(a,b)=>a.days-b.days,plow:(a,b)=>a.p-b.p,phigh:(a,b)=>b.p-a.p,km:(a,b)=>a.km-b.km,year:(a,b)=>b.y-a.y}[F.sort];
  return r.sort(s);
}

function renderResults(){
  const l=L(),r=filtered();
  document.getElementById('rcount').innerHTML=t(l.results,{n:`<b>${r.length}</b>`});

  const chips=[];
  if(F.mk)chips.push(['mk',nm(MAKES,F.mk)]);if(F.gv)chips.push(['gv',nm(GOVS,F.gv)]);
  if(F.pmin)chips.push(['pmin','≥ '+fmt(F.pmin)]);if(F.pmax)chips.push(['pmax','≤ '+fmt(F.pmax)]);if(F.ymin)chips.push(['ymin','≥ '+F.ymin]);if(F.kmmax)chips.push(['kmmax','≤ '+fmt(F.kmmax)+' '+l.km]);
  if(F.insp)chips.push(['insp',l.inspOnly]);if(F.legal)chips.push(['legal',l.legalOnly]);
  ['src','tr','bd','fu'].forEach(k=>F[k].forEach(v=>chips.push([k+':'+v,({src:l.sources,tr:l.transM,bd:l.bodyM,fu:l.fuelM})[k][v]])));
  document.getElementById('achips').innerHTML=chips.map(([k,v])=>`<button type="button" data-rm="${k}">${esc(v)} ${I.x}</button>`).join('');

}
function bindCars(){
  const form=document.getElementById('filters');
  form.addEventListener('input',e=>{const el=e.target;
    if(el.dataset.k)F[el.dataset.k]=el.value.replace(/[^\d\w]/g,'');
    else if(el.dataset.arr){const a=F[el.dataset.arr];el.checked?a.push(el.value):a.splice(a.indexOf(el.value),1)}
    else if(el.id==='ff-insp')F.insp=el.checked;else if(el.id==='ff-legal')F.legal=el.checked;
    F.model='';renderResults()});
  form.addEventListener('submit',e=>e.preventDefault());
  document.getElementById('sort').onchange=e=>{F.sort=e.target.value;renderResults()};
  const clear=()=>{F={mk:'',pmin:'',pmax:'',ymin:'',kmmax:'',tr:[],fu:[],bd:[],gv:'',src:[],insp:false,legal:false,sort:F.sort};render()};
  document.getElementById('fclear').onclick=clear;
  document.getElementById('fopen').onclick=()=>{form.classList.add('open');document.body.style.overflow='hidden'};
  const close=()=>{form.classList.remove('open');document.body.style.overflow=''};
  document.getElementById('fclose').onclick=close;document.getElementById('fapply').onclick=close;
  document.getElementById('achips').onclick=e=>{const b=e.target.closest('[data-rm]');if(!b)return;const k=b.dataset.rm;
    if(k.includes(':')){const[a,v]=k.split(':');F[a]=F[a].filter(x=>x!==v)}else if(k==='insp'||k==='legal')F[k]=false;else F[k]='';render()};
  document.getElementById('results').addEventListener('click',e=>{if(e.target.closest('[data-clear]'))clear()});
  renderResults();
}

  const prog=l.wsteps.map((x,i)=>`<li class="${i<s?'done':i===s?'cur':''}"${i===s?' aria-current="step"':''}><span>${i+1}. ${x}</span></li>`).join('');
  let body='';
  if(s===0)body=`<div class="fgrid"><div class="field"><label for="w-mk">${l.f.make}</label><select class="input" id="w-mk" data-w="mk">${opts(MAKES,W.mk)}</select></div><div class="field"><label for="w-md">${l.f.model}</label><input class="input" id="w-md" data-w="md" value="${esc(W.md)}"></div><div class="field"><label for="w-y">${l.year}</label><input class="input num" id="w-y" data-w="y" inputmode="numeric" value="${esc(W.y)}"></div><div class="field"><label for="w-km">${l.mileage} (${l.km})</label><input class="input num" id="w-km" data-w="km" inputmode="numeric" value="${esc(W.km)}"></div><div class="field full"><label for="w-tr">${l.transL}</label><select class="input" id="w-tr" data-w="tr">${Object.keys(l.transM).map(k=>`<option value="${k}"${k===W.tr?' selected':''}>${l.transM[k]}</option>`).join('')}</select></div></div>`;
  if(s===1)body=`<div class="notice n-info">${I.info}<span>${l.declNote}</span></div><div class="fgrid"><div class="field"><label for="w-cond">${l.condO}</label><select class="input" id="w-cond" data-w="cond">${Object.keys(l.condM).map(k=>`<option value="${k}"${k===W.cond?' selected':''}>${l.condM[k]}</option>`).join('')}</select></div><div class="field"><label for="w-paint">${l.paintL}</label><select class="input" id="w-paint" data-w="paint">${Object.keys(l.paintM).map(k=>`<option value="${k}"${k===W.paint?' selected':''}>${l.paintM[k]}</option>`).join('')}</select></div><div class="field full"><label for="w-acc">${l.accL}</label><select class="input" id="w-acc" data-w="acc">${Object.keys(l.accM).map(k=>`<option value="${k}"${k===W.acc?' selected':''}>${l.accM[k]}</option>`).join('')}</select></div><div class="field full"><label for="w-desc">${l.desc}</label><textarea class="input" id="w-desc" data-w="desc">${esc(W.desc)}</textarea></div></div>`;
  if(s===2)body=`<div class="fgrid"><div class="field"><label for="w-p">${l.price} (${l.egp})</label><input class="input num" id="w-p" data-w="p" inputmode="numeric" value="${esc(W.p)}"><span class="help num">${fmt(+W.p||0)} ${l.egp}</span></div><div class="field" style="align-content:end"><label style="display:flex;gap:8px;align-items:center;min-height:44px"><input type="checkbox" id="w-neg" data-w="neg"${W.neg?' checked':''} style="accent-color:var(--green-ink)">${l.negL}</label></div><div class="field"><label for="w-gv">${l.f.gov}</label><select class="input" id="w-gv" data-w="gv">${opts(GOVS,W.gv)}</select></div><div class="field"><label for="w-ct">${l.city}</label><select class="input" id="w-ct" data-w="ct">${opts(CITIES,W.ct)}</select></div></div>`;
  if(s===3){const demo={mk:W.mk,md:W.md,bd:'sedan',col:'white'};body=`<p class="help">${l.photosHelp}</p><div class="photos">${l.angles.map((a,i)=>i<4?`<div class="has" title="${a}">${carSVG(demo,i%3)}</div>`:`<div>+ ${a}</div>`).join('')}</div>`}
  if(s===4){body=`<div class="tbl-wrap"><table class="kv"><tbody><tr><th>${l.car}</th><td><bdi>${nm(MAKES,W.mk)} ${esc(W.md)}</bdi> <span class="num">${esc(W.y)}</span></td></tr><tr><th>${l.mileage}</th><td class="num">${fmt(+W.km||0)} ${l.km}</td></tr><tr><th>${l.price}</th><td class="num">${fmt(+W.p||0)} ${l.egp} · ${W.neg?l.neg:l.fixed}</td></tr><tr><th>${l.loc}</th><td>${nm(CITIES,W.ct)}، ${nm(GOVS,W.gv)}</td></tr><tr><th>${l.paintL}</th><td>${l.paintM[W.paint]} <span class="chip c-info">${l.srcSeller}</span></td></tr></tbody></table></div><label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="w-rules" data-w="rules"${W.rules?' checked':''} style="margin-top:7px;accent-color:var(--green-ink)">${l.rulesOk}</label><span class="help" id="e-rules" hidden style="color:var(--danger)"></span>`}
  return `<div class="pagehead"><div class="wrap"><nav class="crumbs"><a href="#home">${l.home}</a><span aria-hidden="true">/</span><span>${l.sell}</span></nav><h1>${l.wizT}</h1><p class="small">${l.wizS}</p></div></div>
  <div class="wrap"><form class="wiz" id="wiz" novalidate><ol class="progress">${prog}</ol><div class="panel">${body}</div>
   <div class="wnav"><button class="btn btn-outline" type="button" id="wback"${s===0?' disabled':''}>${l.back}</button><button class="btn btn-primary" type="submit">${s===4?l.submit:l.next}</button></div></form></div>`;
}
function bindSell(){
  const f=document.getElementById('wiz');
  f.addEventListener('input',e=>{const k=e.target.dataset.w;if(!k)return;W[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;if(k==='p'){const h=e.target.nextElementSibling;if(h)h.textContent=fmt(+W.p||0)+' '+L().egp}});
  document.getElementById('wback').onclick=()=>{W.step=Math.max(0,W.step-1);render()};
  f.addEventListener('submit',e=>{e.preventDefault();
    if(W.step<4){W.step++;render();return}
    if(!W.rules){const er=document.getElementById('e-rules');er.textContent=lang==='ar'?'لازم توافق على قواعد الإعلان قبل الإرسال':'Please accept the listing rules before submitting';er.hidden=false;return}
    const id=Math.max(...CARS.map(c=>c.id))+1;
    CARS.push({id,mk:W.mk,md:W.md||'—',trim:'',y:+W.y||2018,km:+W.km||0,p:+W.p||0,neg:W.neg?1:0,tr:W.tr,fu:'petrol',bd:'sedan',gv:W.gv,ct:W.ct,src:'individual_seller',col:'white',cc:1600,feat:0,st:'pending',insp:{s:'none'},legal:'none',seller:'Mona',sellerAr:'منى',mine:1,days:0,subMin:0,cond:{overall:W.cond,paint:W.paint,accident:W.acc,service:'partial',owners:1}});
    AUDIT.unshift({t:0,a:{ar:`إرسال إعلان #${id} للمراجعة`,en:`Listing #${id} submitted for review`}});
    W.step=0;W.rules=false;DT='cars';toast(L().toastSub);location.hash='#account'});
}

let DT='overview',AT='overview',REJ=null;
function stChip(c){const l=L();const m={publish:'c-ok',pending:'c-warn',rejected:'c-danger',draft:'c-neutral'};return `<span class="chip ${m[c.st]}">${l.st[c.st]}</span>`}
function thumbRow(c,extra,acts){return `<div class="qrow"><div class="thumb">${carSVG(c,0)}</div><div style="min-width:0"><h3>${title(c)} <span class="num">${c.y}</span></h3><div class="m num">${fmt(c.p)} ${L().egp} · ${fmt(c.km)} ${L().km} · ${nm(CITIES,c.ct)}</div>${extra||''}</div><div class="acts">${acts||''}</div></div>`}
function vAccount(){
  const l=L(),mine=CARS.filter(c=>c.mine);
  const nav=Object.keys(l.dNav).map(k=>`<button type="button" data-dt="${k}" aria-current="${DT===k}">${l.dNav[k]}${k==='inq'&&INQ.length?`<span class="cnt">${INQ.length}</span>`:''}</button>`).join('');
  let main='';
  if(DT==='overview'){main=`<h1>${l.dNav.overview}</h1><div class="kpis num"><div class="kpi"><span>${l.kLive}</span><b>${mine.filter(c=>c.st==='publish').length}</b></div><div class="kpi${mine.some(c=>c.st==='pending')?' attn':''}"><span>${l.kPending}</span><b>${mine.filter(c=>c.st==='pending').length}</b></div><div class="kpi"><span>${l.kViews}</span><b>412</b><small>${l.demoNums}</small></div><div class="kpi"><span>${l.kContacts}</span><b>${23+INQ.length}</b><small>${l.demoNums}</small></div></div>
   ${mine.filter(c=>c.st==='rejected').map(c=>`<div class="notice n-warn">${I.info}<span><b>${title(c)}</b> — ${l.st.rejected}: ${l.reasons[c.rej||0]}. ${lang==='ar'?'عدّل الصور وابعته تاني.':'Update the photos and resubmit.'}</span></div>`).join('')}
   <div class="box"><h2>${l.dNav.cars}</h2>${mine.map(c=>thumbRow(c,`<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${stChip(c)}${c.st==='publish'?inspChip(c):''}</div>`)).join('')}</div>`}
  if(DT==='cars'){main=`<h1>${l.dNav.cars}</h1><div class="box">${mine.map(c=>thumbRow(c,`<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${stChip(c)}${c.st==='rejected'?`<span class="small">${l.rejReason}: ${l.reasons[c.rej||0]}</span>`:''}</div>`,`${c.st==='publish'?`<a class="btn btn-outline btn-s" href="#car-${c.id}">${l.view}</a>`:''}<button class="btn btn-outline btn-s" type="button" data-demo="1">${l.edit}</button>${c.st==='publish'?`<button class="btn btn-outline btn-s" type="button" data-demo="1">${l.markSold}</button>`:''}`)).join('')}<a class="btn btn-primary" href="#sell" style="justify-self:start">+ ${l.wizT}</a></div>`}
  if(DT==='inq'){main=`<h1>${l.inqT}</h1><div class="box">${INQ.length?INQ.map(q=>{const c=CARS.find(x=>x.id===q.car);return `<div class="qrow" style="grid-template-columns:1fr"><div><h3>${esc(q.name)} · <span class="small">${title(c)}</span></h3><p class="small">${esc(q.msg)}</p><span class="small">${l.now}</span></div></div>`}).join(''):`<div class="empty" style="border:0"><p>${l.noInq}</p><a class="btn btn-outline" href="#car-4">${lang==='ar'?'جرّب تبعت استفسار على عربية منى':'Try sending an inquiry on Mona’s car'}</a></div>`}</div>`}
  if(DT==='insp'){main=`<h1>${l.dNav.insp}</h1><div class="box">${mine.filter(c=>c.st==='publish').map(c=>thumbRow(c,`<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${inspChip(c)}${legalChip(c)||`<span class="chip c-neutral">${l.legalNone}</span>`}</div>`)).join('')}</div>`}
  if(DT==='settings'){main=`<h1>${l.dNav.settings}</h1><div class="box"><div class="fgrid"><div class="field"><label for="s-n">${l.name}</label><input class="input" id="s-n" value="${lang==='ar'?'منى':'Mona'}"></div><div class="field"><label for="s-p">${l.phone}</label><input class="input num" id="s-p" dir="ltr" placeholder="01xxxxxxxxx"></div></div></div>`}
  return `<div class="dash"><aside class="rail dark"><div class="who"><span class="avatar">M</span><div>${l.sellerName}<small>${l.memberRole}</small></div></div><nav aria-label="${l.dashSeller}">${nav}</nav></aside><div class="dmain">${main}</div></div>`;
}
function vAdmin(){
  const l=L(),P=pub(),pend=CARS.filter(c=>c.st==='pending'),awaitI=CARS.filter(c=>c.st==='publish'&&c.insp.s==='completed'&&!c.insp.approved),openI=CARS.filter(c=>c.st==='publish'&&['requested','scheduled'].includes(c.insp.s));
  const nav=Object.keys(l.aNav).map(k=>`<button type="button" data-at="${k}" aria-current="${AT===k}">${l.aNav[k]}${k==='pending'&&pend.length?`<span class="cnt">${pend.length}</span>`:''}${k==='insp'&&awaitI.length?`<span class="cnt">${awaitI.length}</span>`:''}</button>`).join('');
  const pendBox=`<div class="box"><h2>${l.pendingT}<span class="chip c-warn num">${pend.length}</span></h2>${pend.length?pend.map(c=>thumbRow(c,`<div class="m" style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">${srcChip(c)} ${l.by} ${esc(sellerName(c))} · ${c.subMin?t(l.ago,{n:c.subMin}):l.now}</div>`,REJ===c.id?`<div class="rejectbox"><select class="input" id="rej-r" aria-label="${l.rejReason}">${l.reasons.map((r,i)=>`<option value="${i}">${r}</option>`).join('')}</select><button class="btn btn-danger btn-s" type="button" data-rejc="${c.id}">${l.confirmReject}</button><button class="btn btn-outline btn-s" type="button" data-rejx="1">${l.cancel}</button></div>`:`<button class="btn btn-primary btn-s" type="button" data-appr="${c.id}">${l.approve}</button><button class="btn btn-danger btn-s" type="button" data-rej="${c.id}">${l.reject}</button>`)).join(''):`<p class="small">${l.noPending}</p>`}</div>`;
  const inspBox=`<div class="box"><h2>${l.inspQ}</h2><div class="notice n-info">${I.info}<span>${l.fourEyes}</span></div>${awaitI.length?awaitI.map(c=>thumbRow(c,`<div class="m" style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">${inspChip(c)} ${l.inspector}: <b>${c.insp.inspector}</b> · ${l.outcome}: ${l.passed}</div>`,`<button class="btn btn-primary btn-s" type="button" data-iapp="${c.id}">${l.approveInsp}</button>`)).join(''):`<p class="small">${l.noInspQ}</p>`}${openI.map(c=>thumbRow(c,`<div style="margin-top:4px">${inspChip(c)}</div>`)).join('')}</div>`;
  const leadsBox=`<div class="box"><h2>${l.leadsT}</h2><div class="tbl-wrap"><table><thead><tr><th>${l.car}</th><th>${l.source}</th><th>${l.channel}</th><th>${l.when}</th></tr></thead><tbody>${LEADS.slice(0,8).map(x=>{const c=CARS.find(y=>y.id===x.car);return `<tr><td>${title(c)}</td><td>${l.sources[c.src]}</td><td>${l.ch[x.ch]}</td><td class="num">${x.t?t(l.ago,{n:x.t}):l.now}</td></tr>`}).join('')}</tbody></table></div></div>`;
  const auditBox=`<div class="box"><h2>${l.auditT}</h2><ul class="audit">${AUDIT.slice(0,10).map(a=>`<li><time class="num">${a.t?t(l.ago,{n:a.t}):l.now}</time><span>${a.a[lang]}</span></li>`).join('')}</ul></div>`;
  let main='';
  if(AT==='overview')main=`<h1>${l.aNav.overview}</h1><div class="kpis num"><div class="kpi"><span>${l.kActive}</span><b>${P.length}</b></div><div class="kpi${pend.length?' attn':''}"><span>${l.kPendingA}</span><b>${pend.length}</b></div><div class="kpi${awaitI.length?' attn':''}"><span>${l.kInspOpen}</span><b>${awaitI.length+openI.length}</b></div><div class="kpi"><span>${l.kLeads}</span><b>${LEADS.length}</b><small>${l.demoNums}</small></div></div>${pendBox}${inspBox}`;
  if(AT==='pending')main=`<h1>${l.aNav.pending}</h1>${pendBox}`;
  if(AT==='insp')main=`<h1>${l.aNav.insp}</h1>${inspBox}`;
  if(AT==='leads')main=`<h1>${l.aNav.leads}</h1>${leadsBox}`;
  if(AT==='audit')main=`<h1>${l.aNav.audit}</h1>${auditBox}`;
  return `<div class="dash"><aside class="rail dark"><div class="who"><span class="avatar">A</span><div>${l.adminName}<small>${l.adminRole}</small></div></div><nav aria-label="${l.dashAdmin}">${nav}</nav></aside><div class="dmain">${main}</div></div>`;
}
function bindDash(){
  document.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>{DT=b.dataset.dt;render()});
  document.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>{AT=b.dataset.at;REJ=null;render()});
  const l=L();
  document.querySelector('.dmain')?.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.demo){toast(lang==='ar'?'في الموقع الحقيقي بيفتح نموذج التعديل.':'Opens the edit form on the live site.')}
    if(b.dataset.appr){const c=CARS.find(x=>x.id==b.dataset.appr);c.st='publish';c.days=0;AUDIT.unshift({t:0,a:{ar:`موافقة ونشر إعلان #${c.id} (بدون شارة فحص)`,en:`Listing #${c.id} approved & published (no inspection badge)`}});toast(l.toastApprove);render()}
    if(b.dataset.rej){REJ=+b.dataset.rej;render()}
    if(b.dataset.rejx){REJ=null;render()}
    if(b.dataset.rejc){const c=CARS.find(x=>x.id==b.dataset.rejc);const r=+document.getElementById('rej-r').value;c.st='rejected';c.rej=r;REJ=null;AUDIT.unshift({t:0,a:{ar:`رفض إعلان #${c.id} — ${T.ar.reasons[r]}`,en:`Listing #${c.id} rejected — ${T.en.reasons[r]}`}});toast(l.toastReject);render()}
    if(b.dataset.iapp){const c=CARS.find(x=>x.id==b.dataset.iapp);c.insp.approved=1;AUDIT.unshift({t:0,a:{ar:`اعتماد فحص سيارة #${c.id} — ${c.insp.inspector} فحص، المدير اعتمد`,en:`Inspection approved for car #${c.id} — inspected by ${c.insp.inspector}, approved by manager`}});toast(l.toastInspOk);render()}
  });
}

/* ---------- router ---------- */
function route(){const h=(location.hash||'#home').slice(1);if(/^car-\d+$/.test(h))return['car',+h.split('-')[1]];return[['home','cars','sell','account','admin'].includes(h)?h:'home']}
let lastRoute='';
function render(){
  const [r,id]=route(),app=document.getElementById('app');
  chrome(r);gid=0;
  app.innerHTML=r==='home'?vHome():r==='cars'?vCars():r==='car'?vCar(id):r==='sell'?vSell():r==='account'?vAccount():vAdmin();
  if(r==='cars')bindCars();if(r==='car')bindCar(id);if(r==='sell')bindSell();if(r==='account'||r==='admin')bindDash();
  if(r==='home')bindHome();
  const key=location.hash;if(key!==lastRoute){window.scrollTo(0,0);lastRoute=key}
}
function bindHome(){
  const mk=document.getElementById('hs-make'),mdl=document.getElementById('hs-model');
  mk.onchange=()=>{const ms=[...new Set(pub().filter(c=>c.mk===mk.value).map(c=>c.md))];mdl.innerHTML=`<option value="">${L().f.any}</option>`+ms.map(m=>`<option>${m}</option>`).join('')};
  document.getElementById('heroSearch').onsubmit=e=>{e.preventDefault();F={mk:mk.value,model:mdl.value,pmin:'',pmax:document.getElementById('hs-pmax').value,ymin:document.getElementById('hs-year').value,kmmax:'',tr:[],fu:[],bd:[],gv:document.getElementById('hs-gov').value,src:[],insp:false,legal:false,sort:'new'};location.hash='#cars';if(location.hash==='#cars')render()};
}
document.addEventListener('click',e=>{
  const fav=e.target.closest('[data-fav]');if(fav){const id=+fav.dataset.fav;FAVS.has(id)?FAVS.delete(id):FAVS.add(id);fav.setAttribute('aria-pressed',FAVS.has(id));toast(FAVS.has(id)?L().toastFav:L().toastFavOff);return}
  const mk=e.target.closest('[data-make]');if(mk){F={mk:mk.dataset.make,pmin:'',pmax:'',ymin:'',kmmax:'',tr:[],fu:[],bd:[],gv:'',src:[],insp:false,legal:false,sort:'new'};if(location.hash==='#cars'){e.preventDefault();render()}}
  const an=e.target.closest('[data-anchor]');if(an){e.preventDefault();document.getElementById('mainnav').classList.remove('open');const go=()=>document.getElementById(an.dataset.anchor)?.scrollIntoView({behavior:'smooth'});if(route()[0]!=='home'){location.hash='#home';setTimeout(go,60)}else go()}
  const soon=e.target.closest('[data-soon]');if(soon){e.preventDefault();toast(lang==='ar'?'دليل المعارض: صفحة /dealers/ في الموقع الحقيقي.':'Dealer directory: the /dealers/ page on the live site.')}
  if(e.target.closest('.mainnav a')&&!an&&!soon)document.getElementById('mainnav').classList.remove('open');
});
document.getElementById('menubtn').onclick=e=>{const n=document.getElementById('mainnav');const o=n.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',o)};
document.getElementById('langbtn').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('cg-lang',lang)}catch(e){}render()};
window.addEventListener('hashchange',()=>{document.body.style.overflow='';render()});
render();
})();
</script>
